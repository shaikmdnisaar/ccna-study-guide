<script>
/* ================= AUDIO ENGINE (WebAudio, zero files) ================= */
const AU={sfx:true, vox:true, ctx:null};
function ac(){ if(!AU.ctx) AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); return AU.ctx; }
function tone(freq,dur=.09,type='square',vol=.16,when=0,slide=0){
  if(!AU.sfx) return;
  try{
    const c=ac(), o=c.createOscillator(), g=c.createGain(), t=c.currentTime+when;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const SFX={
  click:()=>tone(660,.05,'square',.08),
  good:()=>{tone(523,.08);tone(659,.08,'square',.14,.08);tone(784,.12,'square',.14,.16);},
  bad:()=>{tone(220,.12,'sawtooth',.12);tone(160,.16,'sawtooth',.12,.1);},
  xp:()=>tone(880,.07,'triangle',.12,0,220),
  levelup:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.1,'square',.13,i*.09));},
  boss:()=>{[392,311,392,466].forEach((f,i)=>tone(f,.14,'sawtooth',.12,i*.12));},
  star:()=>{[784,988,1175].forEach((f,i)=>tone(f,.09,'triangle',.13,i*.07));},
  boot:()=>{tone(130,.25,'sine',.15);tone(196,.2,'sine',.12,.1);}
};
function speak(text){
  if(!AU.vox || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[#>*_]/g,' '));
    u.rate=1.02; u.pitch=1.0; u.volume=.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.getElementById('muteSfx').onclick=e=>{AU.sfx=!AU.sfx;e.target.textContent=AU.sfx?'🔊 SFX':'🔇 SFX';};
document.getElementById('muteVox').onclick=e=>{AU.vox=!AU.vox;if(!AU.vox)speechSynthesis.cancel();e.target.textContent=AU.vox?'🎙 VOICE':'🔇 VOICE';};

/* ================= STATE ================= */
const KEY='labquests1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{xp:0,stars:{},missions:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(S));renderHUD();}
const RANKS=[[0,'Rookie'],[150,'Operative'],[400,'Engineer'],[800,'Architect'],[1400,'Network Hero'],[2200,'🏆 LEGEND']];
function rankOf(x){let r=RANKS[0][1];for(const[t,n]of RANKS)if(x>=t)r=n;return r;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1700);}
function award(n){S.xp+=n;save();SFX.xp();toast('+'+n+' XP');}
function starsOf(q){return S.stars[q.id]||0}
function totalStars(){return Object.values(S.stars).reduce((a,b)=>a+b,0)}

/* ================= IOS SIM ================= */
function canonTok(t){
  t=t.toLowerCase();
  const M={gigabitethernet:'gig',gigabite:'gig',gigabit:'gig',fastethernet:'fa',ethernet:'e',
           show:'sh',shutdown:'shut',configure:'conf',terminal:'t',interface:'int',
           vlan:'vl',gigabitethernet0:'gig0'};
  return M[t]||t;
}
function normCmd(c){
  return c.toLowerCase().split(/[\s\/]+/).filter(Boolean).map(canonTok).join(' ');
}
function cmdMatches(user, want){
  return normCmd(user)===normCmd(want);
}

/* ================= TEACH LINES per topic (narration) ================= */
function teachLine(q, mi){
  const t=q.topic;
  const byTopic={
    'Neighbor Discovery':'Discovery protocols map what is physically attached. Run the show commands, read every column.',
    'Switching':'VLANs and trunks segment broadcast domains at Layer 2. Watch which mode you are in — config vs interface.',
    'Address Translation':'NAT translates private to public. Static is 1-to-1, dynamic uses a pool, PAT multiplexes ports.',
    'Security':'ACLs filter traffic. Standard matches source only; extended matches source, destination, protocol, port.',
    'Routing':'OSPF builds a link-state map: neighbors exchange LSAs, SPF computes best paths. Match network statements carefully.',
    'Services':'NTP synchronizes time, DHCP leases addresses. Logs without synced time are fiction.'
  };
  return `${q.name}. Mission ${mi+1}. ${byTopic[t]||''}`;
}

let filter='all';

function renderHUD(){
  document.getElementById('xp').textContent=S.xp;
  document.getElementById('rank').textContent=rankOf(S.xp);
  document.getElementById('stars').textContent=totalStars();
  document.getElementById('tstars').textContent=QUESTS.length;
  document.getElementById('pfill').style.width=Math.min(100,totalStars()/QUESTS.length*100)+'%';
}

function unlockedQ(q){
  const minDiff = Math.min(...QUESTS.map(x=>x.diff));
  if(q.diff <= minDiff) return true;            // entry tier always open
  const done=QUESTS.filter(x=>starsOf(x)>0);

function examDone(){
  const total=exCur._run.length;

  save();
  const pass=pct>=80;
  if(pass&&(pct>prev)){SFX.levelup();award(100);}else{SFX.star();if(pct>prev)award(50);}
  const verdict=pass?'🏆 PASSED — CCNA READY SIGNAL':pct>=60?'🛡 SO CLOSE — 80% to pass':'💀 THE TOWER WINS — train and return';
  speak(`Exam complete. Score ${pct} percent. ${pass?'You passed!':'Keep training.'}`);
  document.getElementById('ebody').innerHTML=`<div class="card"><h3>🏰 ${exCur.name} — GAUNTLET COMPLETE</h3>
   <p style="font-size:1.4rem">${verdict}</p>
   <p>Score: <b>${exHit}/${total} (${pct}%)</b> &nbsp;·&nbsp; best: ${Math.max(prev,pct)}%</p>
   <p class="dim">+${pass?100:pct>prev?50:0} XP bonus ${pass?'· pass bonus':'· improvement bonus'} · full 88-question exam re-runs shuffle new sets</p>
   <div class="rowbtns"><button onclick="openExam(EXAMS.find(x=>x.id===${exCur.id}))">🔁 climb again</button>
   <button onclick="backToMap()">🗺 world map →</button></div></div>`;
}

function nextMission(skipped){
  const wasLast = mIdx>=cur.missions.length-1;
  if(!skipped) award(10);
  if(wasLast){
    // star by accuracy: mission commands + quiz answers together
    const tot=hit+miss+quizHit+quizMiss;
    const acc = tot? (hit+quizHit)/tot : 1;
    const star = acc>=.9?3:acc>=.6?2:1;
    const prev=starsOf(cur);
    S.stars[cur.id]=Math.max(prev,star);
    save();
    if(star>prev){SFX.levelup(); if(star===3)SFX.star();}
    const msg = star===3?'FLAWLESS — 3 ⭐':star===2?'SOLID — 2 ⭐':'CLEARED — 1 ⭐';
    speak(`Quest complete. ${cur.name}. ${msg}`);
    document.getElementById('mbody').innerHTML=`<div class="card"><h3>🏁 QUEST COMPLETE: ${cur.name}</h3>
      <p>${msg} &nbsp;(accuracy ${(acc*100).toFixed(0)}%)</p>
      <p class="dim">Now run it LIVE in CML if you have that topology built — sim teaches patterns, the lab makes it permanent.</p>
      <div class="rowbtns"><button onclick="backToMap()">🗺 world map →</button>
      <button onclick="openQuest(QUESTS.find(q=>q.id==='${cur.id}'))">🔁 replay for 3⭐</button></div></div>`;
  } else {
    mIdx++;cmdIdx=0;renderMission();
  }
}

window.openQuest=openQuest; window.backToMap=backToMap; window.wipe=wipe; window.openBook=openBook;

showMap();
